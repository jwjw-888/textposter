<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字海报</title>
<meta name="description" content="输入文字，一键生成小红书风格的文字图片">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='56' rx='6' fill='%23f6efe0' stroke='%23c9a46a' stroke-width='3'/%3E%3Cpath d='M18 20h28M18 30h28M18 40h18' stroke='%233b3226' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4efe6; --panel:#fffdf9; --ink:#2d2620; --muted:#8a7f72; --line:#e6ddcf;
    --accent:#c4683f; --accent-soft:#f7e3d7; --radius:14px;
    --sans:"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei","Microsoft JhengHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  header{padding:22px 20px 6px;max-width:1240px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:24px;letter-spacing:2px}
  header p{margin:0;color:var(--muted);font-size:14px}
  main{max-width:1240px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .controls{display:flex;flex-direction:column;gap:14px}
  .preview{position:sticky;top:12px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.6 var(--sans);color:var(--ink);background:#fff;outline:none;resize:vertical}
  input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{min-height:200px}
  .count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  .section-title{font-size:15px;font-weight:600;margin:0 0 10px}
  .tpls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tpl{border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:12px var(--sans);color:var(--muted)}
  .tpl canvas{width:100%;border-radius:7px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tpl.on{color:var(--ink);font-weight:600}
  .tpl.on canvas{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;align-items:center;gap:10px;margin:10px 0}
  .row>span{width:62px;flex:none;font-size:13px;color:var(--muted)}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:13px var(--sans);color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{width:36px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--accent)}
  .sw.auto{background:conic-gradient(#3b3226 0 25%,#fff1a6 0 50%,#ebe5d8 0 75%,#24324a 0)}
  .sw.pick{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
  .sw.pick input{position:absolute;inset:-8px;width:44px;height:44px;opacity:0;cursor:pointer}
  .seg button .x{margin-left:6px;opacity:.55;font-size:12px}
  .seg button .x:hover{opacity:1}
  .seg button.add{border-style:dashed;color:var(--muted)}
  .sub{font-size:13px;font-weight:600;color:var(--accent);margin:16px 0 2px;padding-top:12px;border-top:1px dashed var(--line);letter-spacing:1px}
  .tools{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:14px var(--sans);color:var(--ink);cursor:pointer}
  .tools button u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
  .tools small{font-size:12px;color:var(--muted)}
  .fstatus{font-size:12px;color:var(--muted);margin:-4px 0 0 72px;min-height:16px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
  .check input{width:18px;height:18px;accent-color:var(--accent)}
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
  .pv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .pv-head .info{font-size:14px;color:var(--muted)}
  .btn{border:none;border-radius:10px;padding:10px 18px;font:600 15px var(--sans);cursor:pointer;background:var(--accent);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .pages{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
  .page{flex:none;width:min(340px,78vw);scroll-snap-align:start;cursor:zoom-in;position:relative}
  .page canvas{width:100%;display:block;border-radius:8px;box-shadow:0 4px 18px rgba(60,40,20,.15)}
  .page .no{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .modal{position:fixed;inset:0;background:rgba(20,15,10,.82);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal.show{display:flex}
  .modal img{max-width:100%;max-height:calc(100vh - 140px);border-radius:8px;-webkit-touch-callout:default}
  .modal .bar{display:flex;gap:10px;margin-top:14px}
  .modal p{color:#eee;font-size:13px;margin:10px 0 0}
  /* 手机：上面固定预览、下面设定各自滑动 */
  @media (max-width:860px){
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column;height:100dvh}
    header{flex:none;padding:10px 16px 4px;margin:0;width:100%}
    header h1{font-size:18px}
    header p{display:none}
    main{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;padding:0;width:100%}
    .preview{position:static;order:0;flex:none;height:46dvh;width:100%;min-width:0;display:flex;flex-direction:column;
      border-radius:0;border-left:0;border-right:0;border-top:0;border-bottom:3px solid var(--line);
      padding:6px 16px 4px;box-shadow:0 4px 10px rgba(60,40,20,.08);z-index:1}
    .pv-head{margin-bottom:6px}
    .pv-head .btn{padding:7px 14px;font-size:14px}
    .pages{flex:1;min-height:0;width:100%;padding:2px 2px 6px;gap:12px}
    .page{width:auto;height:100%}
    .page canvas{width:auto;height:100%}
    .hint{display:none}
    .controls{order:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 40px}
  }
</style>
</head>
<body>
<header>
  <h1>文字海报</h1>
  <p>打字，选样式，存成图片</p>
</header>

<main>
  <div class="controls">
    <section class="panel" id="c-text">
      <label class="f" for="title">标题（可不填）</label>
      <input type="text" id="title" placeholder="比如：今天想说的话" maxlength="60">
      <label class="f" for="body" style="margin-top:12px">正文</label>
      <textarea id="body" placeholder="在这里输入或粘贴文字，换行会保留；空一行就是段落间距。字多了会自动分成好几张。"></textarea>
      <div class="tools">
        <button type="button" id="ulBtn"><u>底线</u> 强调</button>
        <small id="ulTip">先选取正文里的字再按；再按一次可取消</small>
        <span class="count" id="count" style="margin:0 0 0 auto">0 字</span>
      </div>
    </section>

    <section class="panel" id="c-tpl">
      <h2 class="section-title">背景模板</h2>
      <div class="tpls" id="tpls"></div>
      <div class="row" style="margin-top:14px"><span>底色</span><div class="swatches" id="bgColors"></div></div>
    </section>

    <section class="panel" id="c-style">
      <h2 class="section-title">文字样式</h2>
      <div class="row"><span>尺寸</span><div class="seg" id="ratio"></div></div>
      <div class="row"><span>对齐</span><div class="seg" id="align"></div></div>

      <h3 class="sub">标题</h3>
      <div class="row" style="align-items:flex-start"><span style="padding-top:6px">字体</span><div class="seg" id="tfont"></div></div>
      <div class="row"><span>字号</span><input type="range" id="titleSize" min="40" max="140" step="1"><b class="val" id="titleSizeV"></b></div>
      <div class="row"><span>颜色</span><div class="swatches" id="tcolors"></div></div>
      <div class="row"><span>标示笔</span><div class="swatches" id="mcolors"></div></div>

      <h3 class="sub">正文</h3>
      <div class="row" style="align-items:flex-start"><span style="padding-top:6px">字体</span><div class="seg" id="font"></div></div>
      <div class="fstatus" id="fstatus"></div>
      <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden>
      <div class="row"><span>字号</span><input type="range" id="fontSize" min="34" max="84" step="1"><b class="val" id="fontSizeV"></b></div>
      <div class="row"><span>行距</span><input type="range" id="lineHeight" min="1.3" max="2.4" step="0.05"><b class="val" id="lineHeightV"></b></div>
      <div class="row"><span>颜色</span><div class="swatches" id="colors"></div></div>
      <div class="row"><span>底线</span><div class="swatches" id="ucolors"></div></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="indent">首行缩进</label>
        <label class="check"><input type="checkbox" id="marker">标题马克笔</label>
        <label class="check"><input type="checkbox" id="showDate">显示日期</label>
      </div>
    </section>
  </div>

  <section class="panel preview" id="c-preview">
    <div class="pv-head">
      <div class="info" id="pvInfo">预览</div>
      <button class="btn" id="dlAll">下载全部图片</button>
    </div>
    <div class="pages" id="pages"></div>
    <div class="hint">点图片可以放大；手机上放大后长按图片就能存到相册。</div>
  </section>
</main>

<div class="modal" id="modal">
  <img id="modalImg" alt="海报预览">
  <p>手机：长按图片保存到相册　电脑：点“下载”</p>
  <div class="bar">
    <button class="btn" id="modalDl">下载这张</button>
    <button class="btn ghost" id="modalClose">关闭</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- 基本设定 ---------- */
const SANS = '"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei","Microsoft JhengHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif';
const FONTS = {
  sans:    {name:'黑体', stack:SANS},
  serif:   {name:'宋体', stack:'"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun","PMingLiU",serif'},
  kai:     {name:'楷体', stack:'"Kaiti SC","STKaiti","KaiTi","KaiTi_GB2312","DFKai-SB","BiauKai",serif'},
  wenkai:  {name:'文楷',   family:'TP WenKai',   file:'fonts/LXGWWenKaiTC.woff2'},
  kuaile:  {name:'快乐体', family:'TP KuaiLe',   file:'fonts/ZCOOLKuaiLe.woff2'},
  xiaowei: {name:'小薇',   family:'TP XiaoWei',  file:'fonts/ZCOOLXiaoWei.woff2'},
  maobi:   {name:'毛笔',   family:'TP MaShan',   file:'fonts/MaShanZheng.woff2'},
  shouxie: {name:'手写',   family:'TP LongCang', file:'fonts/LongCang.woff2'},
};
for (const f of Object.values(FONTS)) if (f.family) f.stack = `"${f.family}",${SANS}`;

/* 字体按需载入；自己上传的字体存在浏览器的 IndexedDB 里 */
function ensureFont(key){
  const f = FONTS[key];
  if (!f || !f.family || f.ready) return Promise.resolve();
  if (!f.loading) {
    const src = f.buf ? f.buf : `url(${f.file})`;
    f.loading = new FontFace(f.family, src).load()
      .then(ff => { document.fonts.add(ff); f.ready = true; })
      .catch(err => { f.loading = null; throw err; });
  }
  return f.loading;
}
const DB = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('textposter', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fonts', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn){ const db = await this.open(); return new Promise((res, rej) => {
    const tx = db.transaction('fonts', mode); const out = fn(tx.objectStore('fonts'));
    tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); }); },
  all(){ return this.run('readonly', s => s.getAll()); },
  put(v){ return this.run('readwrite', s => s.put(v)); },
  del(id){ return this.run('readwrite', s => s.delete(id)); },
};
function registerCustom(rec){
  FONTS['u:'+rec.id] = {name:rec.name, family:'TPU'+rec.id, buf:rec.buf, custom:true, stack:`"TPU${rec.id}",${SANS}`};
}
const RATIOS = { '3:4':[1080,1440], '1:1':[1080,1080], '9:16':[1080,1920] };
const ALIGNS = { justify:'两端', left:'靠左', center:'居中' };
const COLORS = [null,'#2b2620','#5b3a29','#ffffff','#b23a3a','#2f4f86'];
const MARK_COLORS = [null,'#ffd84d','#ffb3b3','#a8e0cf','#b5ccff','#e2c39a','#d6c0ff'];
const UL_COLORS = [null,'#e2553a','#f2b600','#3a7bd5','#2f9e6e','#2b2620'];

/* 简单的固定随机数，让纸纹每次都一样 */
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }
function grain(ctx,W,H,alpha,color,seed=7){
  const r = rng(seed); ctx.save(); ctx.fillStyle = color;
  const n = Math.round(W*H/700);
  for(let i=0;i<n;i++){ ctx.globalAlpha = alpha*r(); const s = 1+r()*2; ctx.fillRect(r()*W, r()*H, s, s); }
  ctx.restore();
}
function fill(ctx,W,H,c){ ctx.fillStyle=c; ctx.fillRect(0,0,W,H); }
function lin(ctx,W,H,a,b){ const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,a); g.addColorStop(1,b); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

/* 每个模板：base = 默认底色；bg(c,W,H,底色,是否自订) 画背景 */
const TPLS = [
  {id:'cream', name:'奶油纸', base:'#f6efe0', text:'#3b3226', accent:'#d9b273', bg(c,W,H,b){ fill(c,W,H,b); grain(c,W,H,.10,'#8a6a3a'); }},
  {id:'sticky', name:'便签', base:'#fff1a6', text:'#3d3418', accent:'#f2b600', top:180, bg(c,W,H,b){
      fill(c,W,H,b);
      const g=c.createLinearGradient(W*.55,H*.55,W,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(120,90,0,.10)'); c.fillStyle=g; c.fillRect(0,0,W,H);
      grain(c,W,H,.06,'#8a6d00');
      c.save(); c.translate(W/2,46); c.rotate(-0.04); c.fillStyle='rgba(255,255,255,.55)'; c.fillRect(-150,-34,300,84);
      c.strokeStyle='rgba(0,0,0,.05)'; c.strokeRect(-150,-34,300,84); c.restore();
  }},
  {id:'ruled', name:'横线本', base:'#fffdf7', text:'#2b3440', accent:'#f4a3a3', ruled:'rgba(70,120,190,.30)', bg(c,W,H,b){
      fill(c,W,H,b); c.fillStyle='rgba(220,90,90,.45)'; c.fillRect(70,0,3,H);
  }},
  {id:'grid', name:'方格纸', base:'#fbfaf6', text:'#2e2e2e', accent:'#9fd3c7', bg(c,W,H,b){
      fill(c,W,H,b); c.strokeStyle='rgba(60,90,90,.12)'; c.lineWidth=2; const s=54;
      c.beginPath(); for(let x=s/2;x<W;x+=s){c.moveTo(x,0);c.lineTo(x,H);} for(let y=s/2;y<H;y+=s){c.moveTo(0,y);c.lineTo(W,y);} c.stroke();
  }},
  {id:'peach', name:'蜜桃', base:'#ffe6e3', text:'#5a2e2e', accent:'#ff9d9d', bg(c,W,H,b,custom){ custom ? fill(c,W,H,b) : lin(c,W,H,'#ffe6e3','#ffd6bf'); grain(c,W,H,.06,'#a0503a'); }},
  {id:'sky', name:'晴空', base:'#e0ecff', text:'#24324a', accent:'#9dbcff', bg(c,W,H,b,custom){ custom ? fill(c,W,H,b) : lin(c,W,H,'#e0ecff','#f0e4ff'); grain(c,W,H,.05,'#40507a'); }},
  {id:'matcha', name:'抹茶', base:'#e5ecd8', text:'#2f3b27', accent:'#b9d08f', bg(c,W,H,b){ fill(c,W,H,b); grain(c,W,H,.08,'#4d6234'); }},
  {id:'letter', name:'信纸', base:'#fbf6ec', text:'#4a3b2a', accent:'#e2c79c', bg(c,W,H,b){
      fill(c,W,H,b); grain(c,W,H,.07,'#8a6a3a');
      c.strokeStyle='#c4a378'; c.lineWidth=3; c.strokeRect(38,38,W-76,H-76); c.lineWidth=1.5; c.strokeRect(52,52,W-104,H-104);
  }},
  {id:'night', name:'夜读', base:'#1d1e21', text:'#ece6d9', accent:'#a3843f', bg(c,W,H,b){
      fill(c,W,H,b); const g=c.createRadialGradient(W/2,H*.35,50,W/2,H*.35,H*.8);
      g.addColorStop(0,'rgba(255,240,210,.10)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
      grain(c,W,H,.08,'#ffffff');
  }},
  {id:'plain', name:'纯白', base:'#ffffff', text:'#222222', accent:'#ffe066', bg(c,W,H,b){ fill(c,W,H,b); }},
];
const BG_COLORS = [null,'#ffffff','#f6efe0','#fff1a6','#ffe3e8','#e0ecff','#e5ecd8','#ece4f7','#2f3a4a','#1d1e21'];
function luminance(hex){
  const n = parseInt(hex.slice(1),16), f = v => { v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; };
  return .2126*f(n>>16&255) + .7152*f(n>>8&255) + .0722*f(n&255);
}
/* 文字颜色：选了"跟随"时，底色太深就自动换浅色字，太浅就换深色字 */
function textColorFor(st, tpl){
  if (st.color) return st.color;
  if (!st.bg) return tpl.text;
  const bgDark = luminance(st.bg) < .2, txtDark = luminance(tpl.text) < .2;
  if (bgDark && txtDark) return '#f2ede4';
  if (!bgDark && !txtDark) return '#2b2620';
  return tpl.text;
}
const tplById = id => TPLS.find(t=>t.id===id) || TPLS[0];

/* ---------- 状态（会记在浏览器里） ---------- */
const DEFAULTS = {
  title:'把日子过成喜欢的样子',
  body:'不用急着变成别人期待的样子。\n\n慢慢来，按自己的节奏，把每一件小事做好：早上给自己泡一杯热茶，下班路上看一眼晚霞，睡前写下今天值得开心的三件事。\n\n生活不会一下子变好，但会在这些小小的坚持里，一点一点亮起来。',
  tpl:'cream', font:'sans', ratio:'3:4', align:'justify', fontSize:50, titleSize:72, lineHeight:1.8, titleFont:'', titleColor:null, markColor:null, ulColor:null,
  color:null, bg:null, indent:false, marker:true, showDate:false,
};
let st = {...DEFAULTS};
try { const s = JSON.parse(localStorage.getItem('textposter') || 'null'); if (s) st = {...DEFAULTS, ...s}; } catch(e){}
function save(){ try { localStorage.setItem('textposter', JSON.stringify(st)); } catch(e){} }

/* ---------- 排版 ---------- */
const NO_START = '，。、；：！？）》」』】〕〉’”…—～·,.;:!?)]}%';
const NO_END   = '（《「『【〔〈‘“([{';
const TOKEN_RE = /[A-Za-z0-9][A-Za-z0-9'’\-.,:%/@#_&+]*|\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*|[\s\S]/gu;

const mctx = document.createElement('canvas').getContext('2d');
/* 附带/上传的字体只有一种粗细，硬加粗会糊掉，所以标题保持原样 */
const titleWeight = font => (FONTS[font] && FONTS[font].family) ? 400 : 700;
const titleFontOf = st => (st.titleFont && FONTS[st.titleFont]) ? st.titleFont : st.font;
const fontStr = (weight,size,font) => `${weight} ${size}px ${(FONTS[font]||FONTS.sans).stack}`;

function wrap(ctx, text, maxW, indentW){
  const lines = []; let cur = [], curW = indentW;
  const push = (last) => {
    while (cur.length && /^\s+$/.test(cur[cur.length-1].t)) { curW -= cur.pop().w; }
    lines.push({toks:cur, indent: lines.length===0 ? indentW : 0, last});
  };
  // __文字__ = 底线强调
  const toks = [], parts = text.split('__');
  parts.forEach((seg, i) => {
    const em = i % 2 === 1 && i < parts.length - 1;
    if (i % 2 === 1 && !em) seg = '__' + seg;          // 没有成对的 __ 就照原样显示
    for (const t of (seg.match(TOKEN_RE) || [])) {
      const w = ctx.measureText(t).width;
      if (w > maxW * 0.9 && t.length > 1) { for (const ch of t) toks.push({t:ch, w:ctx.measureText(ch).width, em}); }
      else toks.push({t, w, em});
    }
  });
  for (const tok of toks) {
    const isSpace = /^\s+$/.test(tok.t);
    if (isSpace && cur.length === 0) continue;
    if (curW + tok.w > maxW && cur.length) {
      if (NO_START.includes(tok.t[0])) { cur.push(tok); curW += tok.w; continue; } // 标点挂在行尾
      let carry = [];
      if (cur.length > 1 && NO_END.includes(cur[cur.length-1].t)) carry = [cur.pop()];
      curW = cur.reduce((s,x)=>s+x.w,0);
      push(false);
      cur = carry; curW = carry.reduce((s,x)=>s+x.w,0);
      if (isSpace) continue;
    }
    cur.push(tok); curW += tok.w;
  }
  if (cur.length || lines.length === 0) push(true);
  else if (lines.length) lines[lines.length-1].last = true;
  return lines;
}

function layout(st, W, H){
  const tpl = tplById(st.tpl);
  const pad = {l:100, r:100, t: tpl.top || 150, b:130};
  const cw = W - pad.l - pad.r, avail = H - pad.t - pad.b;
  const fs = st.fontSize, lh = fs * st.lineHeight;
  const tfs = st.titleSize, tlh = tfs * 1.35;
  const items = [];

  const title = st.title.trim();
  if (title) {
    mctx.font = fontStr(titleWeight(titleFontOf(st)), tfs, titleFontOf(st));
    for (const ln of wrap(mctx, title, cw, 0)) items.push({kind:'title', h:tlh, g:tfs, line:ln});
    items.push({kind:'space', h: Math.max(fs, tfs*0.6)});
  }
  mctx.font = fontStr(400, fs, st.font);
  const indentW = st.indent ? mctx.measureText('中').width * 2 : 0;
  const paras = st.body.replace(/\r/g,'').split('\n');
  paras.forEach((p, i) => {
    if (!p.trim()) { items.push({kind:'space', h: lh * 0.6}); return; }
    for (const ln of wrap(mctx, p.trim(), cw, indentW)) items.push({kind:'body', h:lh, g:fs, line:ln});
    if (i < paras.length-1 && paras[i+1].trim()) items.push({kind:'space', h: lh * 0.25});
  });

  const pages = [[]]; let y = 0;
  for (const it of items) {
    let page = pages[pages.length-1];
    if (it.kind === 'space' && page.length === 0) continue;
    // 只要字本身放得下就排在这一页（行距的上下留白可以超出）
    const need = it.kind === 'space' ? it.h : it.h/2 + it.g*0.6;
    if (y + need > avail && page.length) { pages.push(page = []); y = 0; if (it.kind === 'space') continue; }
    page.push({...it, y}); y += it.h;
  }
  for (const p of pages) while (p.length && p[p.length-1].kind === 'space') p.pop();
  return {pages, pad, cw, fs, lh, tfs, tlh};
}

function drawLine(ctx, line, x0, yMid, maxW, align, fs, ulColor){
  const total = line.toks.reduce((s,t)=>s+t.w,0);
  const avail = maxW - line.indent;
  let x = x0 + line.indent, gap = 0;
  if (align === 'center') x = x0 + (maxW - total) / 2;
  else if (align === 'justify' && !line.last && line.toks.length > 1 && total < avail) {
    gap = (avail - total) / (line.toks.length - 1);
    if (gap > fs * 0.5) gap = 0;            // 断行太早时就不硬撑开
  }
  const xs = []; let cx = x;
  for (const t of line.toks) { xs.push(cx); cx += t.w + gap; }
  if (ulColor) {                                    // 先画底线再画字
    const fill = ctx.fillStyle; ctx.fillStyle = ulColor;
    const th = Math.max(4, fs * 0.1), uy = yMid + fs * 0.55;
    for (let i = 0; i < line.toks.length; i++) {
      if (!line.toks[i].em) continue;
      let j = i; while (j + 1 < line.toks.length && line.toks[j+1].em) j++;
      while (j > i && /^\s+$/.test(line.toks[j].t)) j--;
      ctx.fillRect(xs[i], uy, xs[j] + line.toks[j].w - xs[i], th);
      i = j;
    }
    ctx.fillStyle = fill;
  }
  line.toks.forEach((t, i) => ctx.fillText(t.t, xs[i], yMid));
  return {x0: align==='center' ? x0 + (maxW-total)/2 : x0 + line.indent, w: total + gap * Math.max(0,line.toks.length-1)};
}

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

function drawPage(ctx, st, W, H, L, pi){
  const tpl = tplById(st.tpl), color = textColorFor(st, tpl);
  const tcolor = st.titleColor || color, mark = st.markColor || tpl.accent;
  const ul = st.ulColor || (st.markColor ? hexA(st.markColor, .95) : hexA(tpl.accent, .95));
  const {pad, cw, fs, lh, tfs, tlh} = L, page = L.pages[pi];
  tpl.bg(ctx, W, H, st.bg || tpl.base, !!st.bg);
  ctx.textBaseline = 'middle';

  // 横线本：在每一行字下面画线，并一路画到底
  if (tpl.ruled) {
    ctx.fillStyle = tpl.ruled;
    let lastY = pad.t;
    for (const it of page) if (it.kind === 'body') { const y = pad.t + it.y + lh/2 + fs*0.68; ctx.fillRect(40, y, W-80, 2); lastY = y; }
    for (let y = lastY + lh; y < H - 110; y += lh) ctx.fillRect(40, y, W-80, 2);
  }

  for (const it of page) {
    const top = pad.t + it.y;
    if (it.kind === 'title') {
      ctx.font = fontStr(titleWeight(titleFontOf(st)), tfs, titleFontOf(st));
      const align = st.align === 'center' ? 'center' : 'left';
      const total = it.line.toks.reduce((s,t)=>s+t.w,0);
      const x = align === 'center' ? pad.l + (cw-total)/2 : pad.l;
      if (st.marker && total > 0) {
        ctx.fillStyle = hexA(mark, tpl.id === 'night' && !st.markColor ? .55 : .6);
        ctx.fillRect(x - 6, top + tlh/2 + tfs*0.08, total + 12, tfs*0.42);
      }
      ctx.fillStyle = tcolor;
      drawLine(ctx, it.line, pad.l, top + tlh/2, cw, align, tfs, ul);
    } else if (it.kind === 'body') {
      ctx.font = fontStr(400, fs, st.font);
      ctx.fillStyle = color;
      drawLine(ctx, it.line, pad.l, top + lh/2, cw, st.align, fs, ul);
    }
  }

  // 页脚：署名、日期、页码
  const total = L.pages.length, ffs = Math.round(Math.max(26, fs * 0.56));
  ctx.font = fontStr(400, ffs, st.font);
  ctx.fillStyle = hexA(color.length === 7 ? color : '#000000', .55);
  const fy = H - 72;
  const right = [];
  if (st.showDate) { const d = new Date(); right.push(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`); }
  if (total > 1) right.push(`${pi+1}/${total}`);
  if (right.length) { ctx.textAlign = 'right'; ctx.fillText(right.join('  ·  '), W - pad.r, fy); }
  ctx.textAlign = 'left';
}

function renderAll(st){
  const [W,H] = RATIOS[st.ratio];
  const L = layout(st, W, H);
  return L.pages.map((_, i) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    drawPage(c.getContext('2d'), st, W, H, L, i);
    return c;
  });
}

/* ---------- 界面 ---------- */
const $ = id => document.getElementById(id);
const pagesEl = $('pages');
let canvases = [];

function seg(el, opts, key){
  el.innerHTML = '';
  for (const [v, label] of Object.entries(opts)) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.className = st[key] === v ? 'on' : '';
    b.onclick = () => { st[key] = v; seg(el, opts, key); update(); };
    el.appendChild(b);
  }
}

function buildTplThumbs(){
  const box = $('tpls'); box.innerHTML = '';
  const sample = {...st, title:'标题', body:'把喜欢的文字\n做成好看的图片', marker:true, showDate:false, fontSize:64, titleSize:90, ratio:'3:4', color:null, bg:null, align:'left', indent:false};
  for (const t of TPLS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tpl' + (st.tpl === t.id ? ' on' : '');
    const c = document.createElement('canvas'); c.width = 216; c.height = 288;
    const ctx = c.getContext('2d'); ctx.scale(0.2, 0.2);
    const s = {...sample, tpl:t.id};
    drawPage(ctx, s, 1080, 1440, layout(s, 1080, 1440), 0);
    b.appendChild(c); b.append(t.name);
    b.onclick = () => { st.tpl = t.id; box.querySelectorAll('.tpl').forEach(x=>x.classList.remove('on')); b.classList.add('on'); update(); };
    box.appendChild(b);
  }
}

/* 颜色圆点：key = 'color'（文字）或 'bg'（底色）；最后一个是自订调色盘 */
function buildSwatches(boxId, list, key, autoTitle){
  const box = $(boxId); box.innerHTML = '';
  const inList = list.includes(st[key]);
  list.forEach(col => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'sw' + (col ? '' : ' auto') + (st[key] === col ? ' on' : '');
    if (col) b.style.background = col;
    b.title = col ? col : autoTitle;
    b.onclick = () => { st[key] = col; buildAllSwatches(); update(); };
    box.appendChild(b);
  });
  const p = document.createElement('label'); p.className = 'sw pick' + (!inList ? ' on' : ''); p.title = '自订颜色';
  if (!inList && st[key]) p.style.background = st[key];
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = st[key] || '#888888';
  inp.oninput = e => { st[key] = e.target.value; p.style.background = st[key]; box.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); p.classList.add('on'); update(); };
  p.appendChild(inp); box.appendChild(p);
}
function buildAllSwatches(){
  buildSwatches('colors', COLORS, 'color', '跟随模板（底色深时自动用浅色字）');
  buildSwatches('tcolors', COLORS, 'titleColor', '跟正文同色');
  buildSwatches('mcolors', MARK_COLORS, 'markColor', '跟随模板');
  buildSwatches('ucolors', UL_COLORS, 'ulColor', '跟标示笔同色');
  buildSwatches('bgColors', BG_COLORS, 'bg', '模板原本的底色');
}

/* 字体按钮：内建 + 网站附带 + 自己上传的 */
function fstatus(t){ $('fstatus').textContent = t || ''; }
function buildFonts(){ buildFontRow('font', 'font'); buildFontRow('tfont', 'titleFont'); }
function buildFontRow(boxId, key){
  const box = $(boxId); box.innerHTML = '';
  const entries = Object.entries(FONTS);
  if (key === 'titleFont') entries.unshift(['', {name:'跟正文'}]);
  for (const [k, f] of entries) {
    const b = document.createElement('button'); b.type = 'button'; b.className = st[key] === k ? 'on' : '';
    b.textContent = f.name;
    if (f.custom && key === 'font') {
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = '删除这个字体';
      x.onclick = async e => {
        e.stopPropagation();
        if (!confirm(`删除字体「${f.name}」？`)) return;
        await DB.del(+k.slice(2)).catch(()=>{});
        delete FONTS[k]; if (st.font === k) st.font = 'sans'; if (st.titleFont === k) st.titleFont = '';
        buildFonts(); buildTplThumbs(); update();
      };
      b.appendChild(x);
    }
    b.onclick = () => selectFont(k, key);
    box.appendChild(b);
  }
  if (key === 'font') {
    const add = document.createElement('button'); add.type = 'button'; add.className = 'add'; add.textContent = '＋ 上传字体';
    add.onclick = () => $('fontFile').click();
    box.appendChild(add);
  }
}
async function selectFont(k, key = 'font'){
  st[key] = k; buildFonts();
  const f = FONTS[k];
  if (f) {
    if (f.family && !f.ready) fstatus(`正在载入「${f.name}」…第一次会慢一点`);
    try { await ensureFont(k); fstatus(''); }
    catch(e){ fstatus(`「${f.name}」载入失败，请检查网络后再点一次`); }
  }
  if (st[key] === k) { buildTplThumbs(); update(); }
}
$('fontFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  fstatus('正在读取字体…');
  const id = Date.now();
  try {
    const rec = {id, name: file.name.replace(/\.(ttf|otf|woff2?)$/i,'').slice(0,16), buf: await file.arrayBuffer()};
    registerCustom(rec);
    await ensureFont('u:'+rec.id);
    let msg = `已加入「${rec.name}」，下次打开还在`;
    try { await DB.put(rec); } catch(err){ msg = `已加入「${rec.name}」（这个浏览器不让保存，关掉网页后要重新上传）`; }
    await selectFont('u:'+rec.id); fstatus(msg);
  } catch(err){
    delete FONTS['u:'+id];
    fstatus('这个文件不是可用的字体（支持 .ttf / .otf / .woff / .woff2）');
  }
};

let timer = 0;
const loadFonts = () => Promise.all([st.font, titleFontOf(st)].map(k => ensureFont(k).catch(()=>{})));
function update(){ clearTimeout(timer); timer = setTimeout(() => loadFonts().then(render), 80); save(); }

function render(){
  canvases = renderAll(st);
  pagesEl.innerHTML = '';
  canvases.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'page';
    d.appendChild(c);
    if (canvases.length > 1) { const n = document.createElement('span'); n.className = 'no'; n.textContent = `${i+1}/${canvases.length}`; d.appendChild(n); }
    d.onclick = () => openModal(i);
    pagesEl.appendChild(d);
  });
  const chars = [...(st.title + st.body).replace(/__|\s/g,'')].length;
  $('count').textContent = `${chars} 字`;
  $('pvInfo').textContent = `共 ${canvases.length} 张 · ${RATIOS[st.ratio].join('×')}`;
  $('dlAll').textContent = canvases.length > 1 ? `下载全部 ${canvases.length} 张` : '下载图片';
}

function fileName(i){
  const base = (st.title.trim() || st.body.replace(/__/g,'').trim().slice(0,12) || '文字海报').replace(/[\\/:*?"<>|\s]+/g,'');
  return canvases.length > 1 ? `${base}-${i+1}.png` : `${base}.png`;
}
function download(i){
  return new Promise(res => canvases[i].toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(i);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { URL.revokeObjectURL(a.href); res(); }, 400);
  }, 'image/png'));
}

let modalIdx = 0;
function openModal(i){ modalIdx = i; $('modalImg').src = canvases[i].toDataURL('image/png'); $('modal').classList.add('show'); }
$('modalClose').onclick = () => $('modal').classList.remove('show');
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('show'); };
$('modalDl').onclick = () => download(modalIdx);
$('dlAll').onclick = async () => { for (let i = 0; i < canvases.length; i++) await download(i); };

/* 底线强调按钮：在选取的文字前后加 / 去掉 __ */
$('ulBtn').addEventListener('pointerdown', e => e.preventDefault());   // 不让文字框失去选取
$('ulBtn').onclick = () => {
  const ta = $('body'), v = ta.value; let a = ta.selectionStart, b = ta.selectionEnd;
  if (a === b) { $('ulTip').textContent = '请先在正文里选取要强调的字'; ta.focus(); return; }
  let out, na, nb;
  if (v.slice(a-2, a) === '__' && v.slice(b, b+2) === '__') {           // 已经有底线 → 取消
    out = v.slice(0, a-2) + v.slice(a, b) + v.slice(b+2); na = a-2; nb = b-2;
  } else {
    const sel = v.slice(a, b);
    if (/^__[\s\S]*__$/.test(sel) && sel.length > 4) { const t = sel.slice(2, -2); out = v.slice(0,a) + t + v.slice(b); na = a; nb = a + t.length; }
    else {
      const clean = sel.replace(/__/g, '');
      const t = clean.split('\n').map(l => l.trim() ? '__' + l + '__' : l).join('\n');
      out = v.slice(0,a) + t + v.slice(b); na = a + (t.startsWith('__') ? 2 : 0); nb = a + t.length - (t.endsWith('__') ? 2 : 0);
    }
  }
  ta.value = out; ta.focus(); ta.setSelectionRange(na, nb);
  $('ulTip').textContent = '先选取正文里的字再按；再按一次可取消';
  st.body = out; update();
};

/* 绑定输入 */
for (const k of ['title','body']) { $(k).value = st[k]; $(k).addEventListener('input', e => { st[k] = e.target.value; update(); }); }
for (const k of ['indent','marker','showDate']) { $(k).checked = st[k]; $(k).addEventListener('change', e => { st[k] = e.target.checked; update(); }); }
for (const k of ['titleSize','fontSize','lineHeight']) {
  const show = () => $(k+'V').textContent = k === 'lineHeight' ? (+st[k]).toFixed(2) : st[k];
  $(k).value = st[k]; show();
  $(k).addEventListener('input', e => { st[k] = +e.target.value; show(); update(); });
}
seg($('ratio'), {'3:4':'3:4 小红书','1:1':'1:1 方形','9:16':'9:16 竖屏'}, 'ratio');
seg($('align'), ALIGNS, 'align');
buildAllSwatches();
(async () => {
  try { for (const rec of await DB.all()) registerCustom(rec); } catch(e){}
  if (!FONTS[st.font]) st.font = 'sans';
  if (st.titleFont && !FONTS[st.titleFont]) st.titleFont = '';
  buildFonts();
  if (FONTS[st.font].family || st.titleFont) { fstatus('正在载入字体…'); await loadFonts(); fstatus(''); }
  buildTplThumbs();
  render();
})();
})();
</script>
